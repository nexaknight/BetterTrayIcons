name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'page/**'
      - 'src/shared/**'
      - 'assets/icon.png'
      - 'assets/logo.svg'
      - 'assets/icons/**'
      - 'media/page/**'
      - 'media/CREDITS.md'
      - 'assets/emoji/CREDITS.md'
      - 'metadata.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The compatibility dialog reads every release tag
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: page/package-lock.json

      - name: Install site dependencies
        run: npm ci --prefix page

      - name: Build site
        run: sh page/build.sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
