name: Release Asset Upload

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  upload:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Detect if this is a release commit
        id: check
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"

          # Fetch latest tags from remote, release-please tags appear after
          # the original CI checkout so they need to be pulled fresh
          git fetch --tags --force

          tag=$(git tag --points-at "$sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [[ -n "$tag" ]]; then
            uuid=$(jq -r .uuid metadata.json)
            name=$(jq -r .name metadata.json)
            {
              echo "is_release=true"
              echo "tag=${tag}"
              echo "uuid=${uuid}"
              echo "name=${name}"
            } >> "$GITHUB_OUTPUT"
            echo "Detected release commit, tag: ${tag}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit"
          fi

      - name: Download CI artifact
        if: steps.check.outputs.is_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.check.outputs.uuid }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename asset
        if: steps.check.outputs.is_release == 'true'
        env:
          UUID: ${{ steps.check.outputs.uuid }}
        run: mv "${UUID}.shell-extension.zip" "${UUID}.zip"

      - name: Add compiled schema for manual installs
        if: steps.check.outputs.is_release == 'true'
        env:
          UUID: ${{ steps.check.outputs.uuid }}
        run: |
          # EGO and the gnome-extensions tool compile schemas during
          # install, manual unzips from the release page don't. The EGO
          # submission zip has to stay clean of gschemas.compiled (shexli
          # flags it for 45+ targets), so only this asset gets it.
          if ! command -v glib-compile-schemas > /dev/null; then
            sudo apt-get update && sudo apt-get install -y libglib2.0-bin
          fi
          glib-compile-schemas schemas/
          zip "${UUID}.zip" schemas/gschemas.compiled

      - name: Wait for Release Please to create the release
        if: steps.check.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          for i in {1..30}; do
            if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
              echo "Release $TAG exists"
              exit 0
            fi
            echo "Waiting for release $TAG to be created (attempt $i/30)..."
            sleep 10
          done
          echo "::error::Release $TAG was not created within 5 minutes"
          exit 1

      - name: Title the release after the extension
        if: steps.check.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          REPO: ${{ github.repository }}
          NAME: ${{ steps.check.outputs.name }}
        # Release Please titles the release with the bare version. The name
        # comes from metadata.json so a rename carries through by itself.
        run: gh release edit "$TAG" --repo "$REPO" --title "${NAME} ${TAG#v}"

      - name: Attach asset to release
        if: steps.check.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          files: ${{ steps.check.outputs.uuid }}.zip
          fail_on_unmatched_files: true